[package]
name = "zenyth"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
grep-regex = "0.1"
grep-searcher = "0.1"
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
